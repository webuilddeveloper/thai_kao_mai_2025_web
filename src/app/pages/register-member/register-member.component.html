<div class="header-container" data-aos="zoom-in-up">
  <div class="header-text">
    <h1>ระบบสมาชิก ลงทะเบียนแฟนคลับพรรค</h1>
    <p>หน้าแรก // <span style="color: #F4ED17;">ลงทะเบียนแฟนคลับพรรค</span></p>
  </div>
</div>
<div class="main">
  <div class="div-main">
    <div class="div-content">
      <span class="head-title d-flex align-items-center">
        กรอกข้อมูลลงทะเบียนแฟนคลับพรรค</span>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <form action="">
        <span class="title">ข้อมูลส่วนตัว</span>
        <div class="row row-form-gap">
          <div class="div-input col-lg-2 col-md-6 col-12">
            <label for="">คำนำหน้า</label>
            <input type="text">
          </div>
          <div class="div-input col-lg-5 col-md-6 col-12">
            <label for="">ชื่อ</label>
            <input type="text">
          </div>
          <div class="div-input col-lg-5 col-md-6 col-12">
            <label for="">นามสกุล</label>
            <input type="text">
          </div>
          <!-- <div class="div-input col-lg-2 col-md-6 col-12">
            <label for="">วัน/เดือน/ปี เกิด</label>
            <input type="text">
          </div> -->
          <div class="div-input col-lg-4 col-md-6 col-12">
            <label for="">เลขประจำตัวประชาชน</label>
            <input type="text">
          </div>
          <div class="div-input col-lg-4 col-md-6 col-12">
            <label for="">เบอร์โทรศัพท์</label>
            <input type="text">
          </div>
          <div class="div-input col-lg-4 col-md-6 col-12">
            <label for="">อีเมล</label>
            <input type="text">
          </div>
        </div>
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div class="d-flex justify-content-center">
          <button class="btn-next" type="button" (click)="openModal()">ลงทะเบียน</button>
        </div>
      </form>
      <div class="modal-backdrop" *ngIf="isModalOpen">
        <div class="modal-box">
          <h2>ลงทะเบียนแฟนคลับสำเร็จ</h2>
          <p>ขอบคุณสำหรับการลงทะเบียนแฟนคลับพรรคไทยก้าวใหม่</p>
          <button (click)="closeModal()" class="btn-main">กลับหน้าแรก</button>
        </div>
      </div>
    </div>
  </div>
</div>
