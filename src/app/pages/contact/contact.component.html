<div class="container-header" data-aos="zoom-in-up">
  <div class="header-container"></div>
  <div class="header-text">
    <h1 class="title" [ngClass]="deviceSize == 'm' ? 'p20' : deviceSize == 't' ? 'p30' : 'p50'">{{ 'contactUs'|translate }}</h1>
    <p class="title" [ngClass]="deviceSize == 'm' ? 'p12' : deviceSize == 't' ? 'p20' : 'p20'">{{'home' | translate}} // <span class="sub-title">{{'contactUs'|translate}}</span></p>
  </div>
</div>

<div class="contact-section">
  <div data-aos="zoom-in">
    <h2>
      <span class="black p32">{{ 'contact' | translate }}</span><span class="yellow">{{ 'us' | translate }}</span>
    </h2>
    <p class="subtext p14">{{'subcontach'|translate}} </p>
  </div>

  <div class="contact-content">
    <div class="map-placeholder" data-aos="fade-right">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3874.677952800841!2d100.5602961!3d13.7982774!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e29d75d4100fb7%3A0x8e9dd129c39ff48b!2sWe%20Build%20%26%20Operate!5e0!3m2!1sth!2sth!4v1752432066309!5m2!1sth!2sth"
        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="contact-info">
      <div data-aos="fade-left">


        <div class="info-row">
          <img src="assets/img/icon_Location.png" alt="location" class="info-icon" />
          <p class="p16">{{ contact.address }}</p>
        </div>

        <div class="info-row">
          <img src="assets/img/icon_Mail.png" alt="email" class="info-icon" />
          <p class="p16">{{ contact.email }}</p>
        </div>

        <div class="info-row">
          <img src="assets/img/icon_Telephone.png" alt="phone" class="info-icon" />
          <p class="p16">{{ contact.phone }}</p>
        </div>
      </div>

      <div class="social-icons" data-aos="fade-up">
        <a *ngFor="let s of contact.social" [href]="s.url" target="_blank">
          <img [src]="s.img" alt="social-icon" />
        </a>
      </div>

    </div>
  </div>
</div>
