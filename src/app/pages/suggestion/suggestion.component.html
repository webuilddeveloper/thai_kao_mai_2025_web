<div class="container-header" data-aos="zoom-in-up">
  <div class="header-container"></div>
  <div class="header-text">
    <h1 class="title">{{'suggestion'| translate}}</h1>
    <p class="title">{{ 'home' | translate }} // <span class="sub-title">{{'suggestion'| translate}}</span></p>
  </div>
</div>
<div class="main">
  <div class="div-main">
    <div class="div-content">
      <span class="head-title d-flex align-items-center">
        {{'fillInformation'| translate}} {{'suggestion'| translate}}</span>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <form action="">
        <div class="row row-form-gap">
         
  

          <div class="div-input col-lg-12 col-md-12 col-12">
            <label for="">{{'email'| translate}} <span style="font-style: italic;">({{'suggestion-information'|translate}})</span></label>
            <input type="text">
          </div>
          
          <div class="div-input col-lg-12 col-md-12 col-12">
            <label for="">{{'suggestion'| translate}}</label>
            <textarea name="" id="" rows="10"></textarea>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="spacer"></div>
        <div class="d-flex justify-content-center">
          <button class="btn-next" type="button" (click)="openModal()">{{'suggestion-confirm'| translate}}</button>
        </div>
      </form>
      <div class="modal-backdrop" *ngIf="isModalOpen">
        <div class="modal-box">
          <h2>{{'suggestion-compleate'| translate}}</h2>
          <p>{{'suggestion-thankyou'| translate}}</p>
          <button (click)="closeModal()" class="btn-main">{{'returnHomePage'| translate}}</button>
        </div>
      </div>
    </div>
  </div>
</div>
