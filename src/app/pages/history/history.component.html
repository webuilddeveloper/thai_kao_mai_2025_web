<div class="container-header" data-aos="zoom-in-up">
  <div class="header-container"></div>
  <div class="header-text">
    <h1 class="title" [ngClass]="deviceSize == 'm' ? 'p20' : deviceSize == 't' ? 'p30' : 'p50'">{{ 'aboutParty' | translate }} </h1>
    <p class="title" [ngClass]="deviceSize == 'm' ? 'p12' : deviceSize == 't' ? 'p20' : 'p20'">{{ 'home' | translate }} // {{ 'ideology' | translate }} // <span class="sub-title">{{ 'history' |
        translate }}</span></p>
  </div>
</div>
<section class="about-section">
  <div class="section-header" data-aos="zoom-in">
    <h2 class="p24">{{ 'history' |
      translate }}</h2>
    <div class="underline"></div>
  </div>

  <div class="about-content">
    <div class="about-logo" data-aos="fade-right">
      <img src="assets/img/logo_.png" alt="โลโก้พรรคไทยก้าวใหม่" />
    </div>

    <div class="about-text" data-aos="fade-up">
      <p class="main-description p16" [innerHTML]="model.description" *ngIf="translate.currentLang === 'th'"></p>
      <p class="main-description p16" [innerHTML]="model.descriptionEN" *ngIf="translate.currentLang === 'en'"></p>

      <div class="highlight-boxes">
        <div class="highlight-box" data-aos="fade-up">
          <h4 class="p18">{{ 'mission' | translate }}</h4>
          <p [innerHTML]="model.mission" *ngIf="translate.currentLang === 'th'"></p>
          <p [innerHTML]="model.missionEN" *ngIf="translate.currentLang === 'en'"></p>
          <!-- <p><strong class="p16">“สร้างสังคมที่ทุกคนมีสิทธิ์ มีเสียง และมีโอกาสอย่างเท่าเทียม”</strong></p>
          <p class="p14">
            พรรคไทยก้าวใหม่มีพันธกิจในการผลักดันการเมืองที่โปร่งใส ตรวจสอบได้

            และสนับสนุนการเติบโตอย่างยั่งยืนในทุกมิติ ทั้งเศรษฐกิจ สังคม และสิ่งแวดล้อม
          </p>
          <p class="small p14">
            เราเชื่อมั่นว่าการพัฒนาประเทศต้องมาจากการมีส่วนร่วมของประชาชนในทุกระดับ
          </p> -->
        </div>

        <div class="highlight-box" data-aos="fade-up">
          <h4 class="p18">{{ 'vision' | translate }}</h4>
          <p [innerHTML]="model.vision" *ngIf="translate.currentLang === 'th'"></p>
          <p [innerHTML]="model.visionEN" *ngIf="translate.currentLang === 'en'"></p>
          <!-- <p><strong class="p16">“ประเทศไทยแห่งอนาคต ที่ประชาชนมีศักดิ์ศรี พัฒนาอย่างยั่งยืน และพร้อมก้าวสู่เวทีโลก”</strong></p>
          <p class="p14">
            พรรคไทยก้าวใหม่มีเป้าหมายที่จะสร้างประเทศที่ประชาชนทุกคนมีโอกาสเท่าเทียมกันในชีวิต
            มีสิทธิในการกำหนดอนาคตของตนเอง และได้รับบริการสาธารณะที่มีคุณภาพ ไม่ว่าจะอยู่ที่ใดในประเทศ
          </p>
          <p class="small p14">
            เรามุ่งหวังให้ประเทศไทยเป็นผู้นำในภูมิภาค ทั้งด้านเศรษฐกิจ เทคโนโลยี การศึกษา
            และการบริหารจัดการที่โปร่งใส โดยไม่ทิ้งใครไว้ข้างหลัง
          </p> -->
        </div>
      </div>

      <div class="navigation-buttons ">
        <button class="nav-btn p20 left-btn" [routerLink]="['/ideology']">← {{'ideology' |
          translate}}</button>
        <button class="nav-btn p20 right-btn" [routerLink]="['/policy']">{{ 'policy'| translate }} →</button>
      </div>
    </div>

  </div>
</section>
